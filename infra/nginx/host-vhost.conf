# Nginx do HOST (sistema) — proxy casadapaz.inovatitech.com.br → Docker 127.0.0.1:9080
# Instalar: sudo ./scripts/install-host-nginx.sh

server {
    listen 443 ssl http2;
    server_name casadapaz.inovatitech.com.br;

    ssl_certificate     /etc/nginx/ssl/casadapaz/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/casadapaz/origin-key.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name casadapaz.inovatitech.com.br;
    return 301 https://$host$request_uri;
}
