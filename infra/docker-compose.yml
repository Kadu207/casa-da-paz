version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: casadapaz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_casadapaz
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: casadapaz_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - rede_casadapaz

  redis:
    image: redis:7-alpine
    container_name: casadapaz_redis
    restart: unless-stopped
    networks:
      - rede_casadapaz

  backend:
    build: ../backend
    container_name: casadapaz_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin_casadapaz:${DB_PASSWORD:-changeme}@db:5432/casadapaz_db
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8000
      N8N_URL: http://n8n:5678
      CHATWOOT_URL: http://chatwoot:3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - rede_casadapaz

  ai-service:
    build: ../ai-service
    container_name: casadapaz_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - rede_casadapaz

  # N8N + Chatwoot: ver docker-compose.messaging.yml + scripts/start-messaging.ps1

  frontend:
    image: nginx:alpine
    container_name: casadapaz_frontend
    restart: unless-stopped
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rede_casadapaz

volumes:
  pgdata:
  n8n_data:

networks:
  rede_casadapaz:
    driver: bridge
