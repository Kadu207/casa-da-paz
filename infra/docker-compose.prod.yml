# Produção Hetzner — executar SOMENTE após confirmação do usuário
# Uso: docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_casadapaz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: casadapaz_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rede_casadapaz

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin_casadapaz:${DB_PASSWORD}@db:5432/casadapaz_db
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://casadapaz.inovatitech.com.br
    depends_on:
      - db
    networks:
      - rede_casadapaz

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - rede_casadapaz

volumes:
  pgdata:

networks:
  rede_casadapaz:
    driver: bridge
