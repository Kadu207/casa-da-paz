# Produção — VPS (Hetzner ou compartilhada)
# Comandos: ./scripts/compose-prod.sh up -d --build  (ou deploy.sh)
#
# Servidor compartilhado (80/443 ocupados): NGINX_CONF=prod-internal.conf + HOST_HTTP_PORT=9080
# VPS dedicada: NGINX_CONF=prod.conf + HOST_BIND=0.0.0.0 + HOST_HTTP_PORT=80

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: admin_casadapaz
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: casadapaz_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rede_casadapaz

  backend:
    build: ../backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgres://admin_casadapaz:${DB_PASSWORD}@db:5432/casadapaz_db
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://casadapaz.inovatitech.com.br
      N8N_URL: ${N8N_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      CHATWOOT_URL: ${CHATWOOT_URL:-}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
    depends_on:
      - db
    networks:
      - rede_casadapaz

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/${NGINX_CONF:-prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_HTTP_PORT:-9080}:80"
    depends_on:
      - backend
    networks:
      - rede_casadapaz

volumes:
  pgdata:

networks:
  rede_casadapaz:
    driver: bridge
