openapi: 3.0.3
info:
  title: Casa da Paz API
  version: 0.1.0
  description: >
    Contrato parcial da API Express. Stack: JWT + RBAC.
    Tesouraria 022–025 e contribuintes não dependem de Asaas.
    POST /auth/usuarios cria UsuarioPolicy (snapshot de grants) no ato do cadastro.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
  /auth/login:
    post:
      summary: Login JWT
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Usuário atual
  /auth/politicas/catalogo:
    get:
      security: [{ bearerAuth: [] }]
      summary: Catálogo de resources/grants e defaults por setor (SUPERVISOR)
  /auth/usuarios:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar usuários
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar usuário com UsuarioPolicy (grants opcionais → snapshot do setor)
  /auth/usuarios/{id}/politicas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Ler policies do usuário
    put:
      security: [{ bearerAuth: [] }]
      summary: Atualizar policies do usuário
  /pessoas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar pessoas
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar pessoa
  /financeiro:
    get:
      security: [{ bearerAuth: [] }]
      summary: Transações com adimplência
  /financeiro/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Agregados receita/despesa
  /financeiro/atrasados:
    get:
      security: [{ bearerAuth: [] }]
      summary: Para N8N lembretes
  /financeiro/contas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Contas financeiras e saldos
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar conta
  /financeiro/transparencia:
    get:
      security: [{ bearerAuth: [] }]
      summary: Transparência interna agregada (sem PII)
  /financeiro/pagamentos-a-fazer:
    get:
      security: [{ bearerAuth: [] }]
      summary: Agenda de pagamentos a fazer (saídas)
  /financeiro/dre:
    get:
      security: [{ bearerAuth: [] }]
      summary: DRE orçado vs realizado
  /financeiro/ofx/import:
    post:
      security: [{ bearerAuth: [] }]
      summary: Import extrato OFX
  /fornecedores:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /contas-pagar:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /mensalidade-planos:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /contribuintes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Patrocínios e padrinhos
    post:
      security: [{ bearerAuth: [] }]
  /cobrancas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar cobranças Asaas
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar cobrança avulsa
  /cobrancas/assinaturas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Assinaturas médiuns
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar assinatura mensal
  /marketing/resumo:
    get:
      security: [{ bearerAuth: [] }]
      summary: KPIs publicação
  /marketing/eventos:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
      summary: Publicar evento
  /marketing/produtos:
    get:
      security: [{ bearerAuth: [] }]
  /eventos:
    get:
      security: [{ bearerAuth: [] }]
  /eventos/{id}/inscricoes/{inscricaoId}/cobrar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Cobrança Asaas para inscrição
  /eventos/{id}/checkin:
    post:
      security: [{ bearerAuth: [] }]
  /livraria/produtos:
    get:
      security: [{ bearerAuth: [] }]
  /livraria/venda:
    post:
      security: [{ bearerAuth: [] }]
  /public/eventos:
    get:
      summary: Eventos abertos (sem auth)
  /public/agendamentos:
    post:
      summary: Agendar consulta (rate limit)
  /public/livraria/pedidos:
    post:
      summary: Checkout público com cobrança Asaas
  /webhooks/asaas:
    post:
      summary: Webhook Asaas (token asaas-access-token)
  /webhooks/pix:
    post:
      summary: Conciliação PIX (stub legado)
  /webhooks/n8n/trigger:
    post:
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
