openapi: 3.0.3
info:
  title: Casa da Paz API
  version: 0.1.0
  description: >
    Contrato parcial da API Express. Stack: JWT + RBAC.
    Tesouraria 022–025 e contribuintes não dependem de Asaas.
    POST /auth/usuarios cria UsuarioPolicy (snapshot de grants) no ato do cadastro.
    Estoque primário (031): /estoque-casa/* — separado da livraria (ADR-010).
    Delegações (033): /delegacoes/* — funções, tarefas, sync-alertas (ADR-011).
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check
  /auth/login:
    post:
      summary: Login JWT
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Usuário atual
  /auth/politicas/catalogo:
    get:
      security: [{ bearerAuth: [] }]
      summary: Catálogo de resources/grants e defaults por setor (SUPERVISOR)
  /auth/usuarios:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar usuários
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar usuário com UsuarioPolicy (grants opcionais → snapshot do setor)
  /auth/usuarios/{id}/politicas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Ler policies do usuário
    put:
      security: [{ bearerAuth: [] }]
      summary: Atualizar policies do usuário
  /pessoas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar pessoas
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar pessoa
  /financeiro:
    get:
      security: [{ bearerAuth: [] }]
      summary: Transações com adimplência
  /financeiro/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Agregados receita/despesa
  /financeiro/atrasados:
    get:
      security: [{ bearerAuth: [] }]
      summary: Para N8N lembretes
  /financeiro/contas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Contas financeiras e saldos
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar conta
  /financeiro/transparencia:
    get:
      security: [{ bearerAuth: [] }]
      summary: Transparência interna agregada (sem PII)
  /financeiro/pagamentos-a-fazer:
    get:
      security: [{ bearerAuth: [] }]
      summary: Agenda de pagamentos a fazer (saídas)
  /financeiro/dre:
    get:
      security: [{ bearerAuth: [] }]
      summary: DRE orçado vs realizado
  /financeiro/ofx/import:
    post:
      security: [{ bearerAuth: [] }]
      summary: Import extrato OFX
  /fornecedores:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /contas-pagar:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /mensalidade-planos:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /contribuintes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Patrocínios e padrinhos
    post:
      security: [{ bearerAuth: [] }]
  /cobrancas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar cobranças Asaas
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar cobrança avulsa
  /cobrancas/assinaturas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Assinaturas médiuns
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar assinatura mensal
  /marketing/resumo:
    get:
      security: [{ bearerAuth: [] }]
      summary: KPIs publicação
  /marketing/eventos:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
      summary: Publicar evento
  /marketing/produtos:
    get:
      security: [{ bearerAuth: [] }]
  /eventos:
    get:
      security: [{ bearerAuth: [] }]
  /eventos/{id}/inscricoes/{inscricaoId}/cobrar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Cobrança Asaas para inscrição
  /eventos/{id}/checkin:
    post:
      security: [{ bearerAuth: [] }]
  /livraria/produtos:
    get:
      security: [{ bearerAuth: [] }]
  /livraria/venda:
    post:
      security: [{ bearerAuth: [] }]
  /estoque-casa/itens:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista itens do estoque primário (estoque_casa)
    post:
      security: [{ bearerAuth: [] }]
      summary: Cadastrar item
  /estoque-casa/movimentacoes:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
      summary: Entrada / saída / ajuste
  /estoque-casa/grupos-limpeza:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /estoque-casa/checklists:
    get:
      security: [{ bearerAuth: [] }]
    post:
      security: [{ bearerAuth: [] }]
  /estoque-casa/checklists/{id}/concluir:
    post:
      security: [{ bearerAuth: [] }]
      summary: Conclui checklist e aplica baixas atômicas
  /estoque-casa/relatorio:
    get:
      security: [{ bearerAuth: [] }]
  /delegacoes/resumo:
    get:
      security: [{ bearerAuth: [] }]
      summary: Totais pendentes / atrasadas (badge menu)
  /delegacoes/funcoes:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista funções + responsáveis + pendentes
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar função (write)
  /delegacoes/funcoes/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Atualizar função (write)
  /delegacoes/funcoes/{id}/responsaveis:
    put:
      security: [{ bearerAuth: [] }]
      summary: Definir responsáveis (write)
  /delegacoes/tarefas:
    get:
      security: [{ bearerAuth: [] }]
      summary: Listar tarefas (filtros)
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar tarefa (write)
  /delegacoes/tarefas/{id}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Editar tarefa (write)
  /delegacoes/tarefas/{id}/toggle:
    post:
      security: [{ bearerAuth: [] }]
      summary: Alterna PENDENTE/CONCLUIDA (read)
  /delegacoes/tarefas/{id}/notificar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Disparo manual e-mail/WhatsApp (write)
  /delegacoes/sync-alertas:
    post:
      security: [{ bearerAuth: [] }]
      summary: D-1 e atrasadas (write / job)
  /marketing/galeria:
    get:
      security: [{ bearerAuth: [] }]
      summary: CRUD listagem galeria (marketing)
    post:
      security: [{ bearerAuth: [] }]
      summary: Criar foto/vídeo (marketing write)
  /marketing/galeria/{id}:
    patch:
      security: [{ bearerAuth: [] }]
    delete:
      security: [{ bearerAuth: [] }]
      summary: Soft unpublish (status RASCUNHO)
  /galeria:
    get:
      security: [{ bearerAuth: [] }]
      summary: Público + interno ao vivo (JWT)
  /galeria/{slug}:
    get:
      security: [{ bearerAuth: [] }]
  /public/galeria:
    get:
      summary: Galeria pública ao vivo
  /public/galeria/{slug}:
    get:
      summary: Detalhe público
  /public/eventos:
    get:
      summary: Eventos abertos (sem auth)
  /public/agendamentos:
    post:
      summary: Agendar consulta (rate limit)
  /public/livraria/pedidos:
    post:
      summary: Checkout público com cobrança Asaas
  /webhooks/asaas:
    post:
      summary: Webhook Asaas (token asaas-access-token)
  /webhooks/pix:
    post:
      summary: Conciliação PIX (stub legado)
  /webhooks/n8n/trigger:
    post:
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
