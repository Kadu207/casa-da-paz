# Mirror CI — GitLab
stages:
  - lint
  - test
  - build

backend-lint:
  stage: lint
  image: node:22-alpine
  script:
    - cd backend && npm ci && npx prisma generate && npm run lint

backend-test:
  stage: test
  image: node:22-alpine
  script:
    - cd backend && npm ci && npx prisma generate && npm test

frontend-build:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend && npm ci && npm test && npm run build
